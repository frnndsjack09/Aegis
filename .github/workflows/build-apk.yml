name: Build APK

# Builds the installable Aegis APK on GitHub's servers.
# Runs on every push, or by hand from the Actions tab ("Run workflow").
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); setup-android@v3's sdkmanager call failed there.

      - uses: gradle/actions/setup-gradle@v4

      # Signs with the permanent release key from repo secrets, so each release installs over the last one.
      - name: Build
        env:
          AEGIS_KEYSTORE_B64: ${{ secrets.AEGIS_KEYSTORE_B64 }}
          AEGIS_KEYSTORE_PASSWORD: ${{ secrets.AEGIS_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$AEGIS_KEYSTORE_B64" ]; then
            echo "$AEGIS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/aegis.jks"
            export AEGIS_KEYSTORE="$RUNNER_TEMP/aegis.jks"
          fi
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon
          rm -f "$RUNNER_TEMP/aegis.jks"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Aegis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-APK
          path: Aegis.apk
