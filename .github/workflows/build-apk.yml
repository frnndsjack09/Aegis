name: Build APK

# Builds the installable Aegis APK on GitHub's servers.
# Runs on every push, or by hand from the Actions tab ("Run workflow").
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME); setup-android@v3's sdkmanager call failed there.

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Aegis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-APK
          path: Aegis.apk
