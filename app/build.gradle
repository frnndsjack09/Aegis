plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aegis.scanner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aegis.scanner'
        minSdk 26          // Android 8.0 and newer
        targetSdk 34
        versionCode 7
        versionName '1.5'
    }

    // One permanent key so every release installs as an update. CI gets it from repo secrets;
    // locally set AEGIS_KEYSTORE (path) and AEGIS_KEYSTORE_PASSWORD. Without them, release falls back to the debug key.
    def ksPath = System.getenv('AEGIS_KEYSTORE')
    def ksPass = System.getenv('AEGIS_KEYSTORE_PASSWORD')
    def haveKey = ksPath && ksPass && file(ksPath).exists()
    signingConfigs {
        if (haveKey) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias 'aegis'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug' // lets a test build sit next to the installed release
        }
        release {
            minifyEnabled false
            signingConfig haveKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Optional Shizuku deep check (Tools tab). Everything else uses the built-in Android SDK.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // real org.json for unit tests (Android's is a stub there)
}
